[build]
  # test:output fails the deploy if a post or page wasn't prerendered
  command = "pnpm build && pnpm test:output"
  publish = "dist"

[build.environment]
  # Node version comes from .node-version
  PNPM_VERSION = "10.34.9"

[[headers]]
  for = "/*"
  [headers.values]
    # The share-free, analytics-free site: own scripts only. Satoshi comes from
    # Fontshare; posts embed YouTube and the swisstopo map. The hash is
    # vite-ember-ssr's inline window.__vite_ember_ssr_rehydrate__=true in every
    # prerendered page: without it the app renders a second copy of the page
    # instead of taking over the prerendered one (tests/output checks it).
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'sha256-MfYh/LekLsLcPVuIvVP7z6hB2DLOW2rpVtqBX4Q+3+w='; style-src 'self' 'unsafe-inline' https://api.fontshare.com; font-src 'self' https://cdn.fontshare.com; img-src 'self' https://s.gravatar.com; connect-src 'self'; frame-src https://www.youtube.com/embed/ https://www.youtube-nocookie.com/embed/ https://map.geo.admin.ch/; manifest-src 'self'; base-uri 'self'; form-action 'none'"

# Fingerprinted by Vite: never change, cache forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Route files: the swisstopo map viewer (map.geo.admin.ch) fetches the KML cross-origin,
# and the GPX should download instead of opening as XML
[[headers]]
  for = "/gpx/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/gpx/*.gpx"
  [headers.values]
    Content-Type = "application/gpx+xml"
    Content-Disposition = "attachment"

[[headers]]
  for = "/gpx/*.kml"
  [headers.values]
    Content-Type = "application/vnd.google-earth.kml+xml"

# Tags are a filter of the front page now, not pages of their own.
# The ratings, grades and fun scale are in groups: they come first, the first match wins.
[[redirects]]
  from = "/tag/1-star"
  to = "/?tags=rating/1-star"
  status = 301

[[redirects]]
  from = "/tag/2-stars"
  to = "/?tags=rating/2-stars"
  status = 301

[[redirects]]
  from = "/tag/3-stars"
  to = "/?tags=rating/3-stars"
  status = 301

[[redirects]]
  from = "/tag/4-stars"
  to = "/?tags=rating/4-stars"
  status = 301

[[redirects]]
  from = "/tag/5-stars"
  to = "/?tags=rating/5-stars"
  status = 301

[[redirects]]
  from = "/tag/t6"
  to = "/?tags=t-grade/t6"
  status = 301

[[redirects]]
  from = "/tag/type-3-fun"
  to = "/?tags=fun/type-3"
  status = 301

[[redirects]]
  from = "/tag/:id"
  to = "/?tags=:id"
  status = 301

# There are no author pages: the whole blog is mine
[[redirects]]
  from = "/author/*"
  to = "/"
  status = 301

# Anything that wasn't prerendered: the app renders its 404 page
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
